services:
  - type: web
    name: contrel-kalkulation
    env: node
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
